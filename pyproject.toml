[project]
name = "inspect-openshell-sandbox"
version = "0.1.0"
description = "An NVIDIA OpenShell sandbox environment for Inspect AI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Retnan Daser" }]
dependencies = ["inspect-ai>=0.3.236", "pyyaml>=6.0"]
keywords = ["inspect-ai", "openshell", "sandbox", "evals", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/32bitsret/inspect-openshell-sandbox"
Repository = "https://github.com/32bitsret/inspect-openshell-sandbox"
Issues = "https://github.com/32bitsret/inspect-openshell-sandbox/issues"
Changelog = "https://github.com/32bitsret/inspect-openshell-sandbox/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

# Inspect discovers sandbox providers through this entry point group. Importing
# the module runs the @sandboxenv decorator, which registers "openshell".
[project.entry-points."inspect_ai"]
openshell-sandbox = "inspect_openshell._sandbox"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_openshell"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
